<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>페이지를 찾을 수 없습니다 · 가운데서 만나</title>
  <meta name="robots" content="noindex" />
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fc;color:#1d2330}.card{width:min(620px,calc(100% - 36px));background:white;border:1px solid #dde1ea;border-radius:24px;padding:34px;box-shadow:0 18px 50px rgba(44,36,108,.1)}span{color:#6d5dfc;font-weight:900}h1{font-size:clamp(32px,7vw,54px);letter-spacing:-.05em;margin:10px 0}p{color:#687083;line-height:1.65}.actions{display:flex;gap:10px;margin-top:24px}a,button{border:0;border-radius:13px;padding:13px 17px;font-weight:800;cursor:pointer;text-decoration:none}.home{background:#6d5dfc;color:white}.back{background:#eef0f5;color:#1d2330}
  </style>
</head>
<body>
  <main class="card"><span>404</span><h1>이 페이지는 찾을 수 없습니다.</h1><p>공유 링크는 주소 뒤의 <strong>#/m/...</strong> 형태를 사용합니다. 홈으로 돌아가 새 모임을 만들거나 받은 링크를 다시 확인해주세요.</p><div class="actions"><a class="home" href="./#/">홈으로 이동</a><button class="back" onclick="history.back()">이전 페이지</button></div></main>
</body>
</html>
