name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAP_PROVIDER: ${{ vars.MAP_PROVIDER }}
      KAKAO_MAPS_JAVASCRIPT_KEY: ${{ vars.KAKAO_MAPS_JAVASCRIPT_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      GEOCODING_COUNTRY_CODES: ${{ vars.GEOCODING_COUNTRY_CODES }}
      OVERPASS_RADIUS_METERS: ${{ vars.OVERPASS_RADIUS_METERS }}
      DEFAULT_LANGUAGE: ${{ vars.DEFAULT_LANGUAGE }}
      DEFAULT_STYLE: ${{ vars.DEFAULT_STYLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
